name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci
          POSTGRES_DB: atlas_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://atlas:atlas_ci@localhost:5432/atlas_ci
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas_ci@localhost:5432/atlas_ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests migrations/env.py
      - name: Tests (incl. migration round-trip)
        run: uv run pytest
      - name: Migrations apply and match models
        run: uv run alembic upgrade head && uv run alembic check
